<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>双摆混沌模拟器 · Week 05</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0d0d18; display: flex; flex-direction: column; }
  canvas { display: block; cursor: grab; }
  canvas:active { cursor: grabbing; }
  #controls {
    height: 162px; flex-shrink: 0;
    background: linear-gradient(180deg, #141422, #0d0d18);
    border-top: 1px solid rgba(120,80,200,0.12);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; padding: 8px 24px;
    font-family: 'Cascadia Code','Consolas','Courier New',monospace;
  }
  .presets-row {
    display: flex; align-items: center; gap: 10px;
  }
  .presets-label {
    font-size: 10px; color: rgba(160,140,210,0.4);
    letter-spacing: 0.5px; user-select: none; margin-right: 4px;
  }
  .preset-btn {
    padding: 5px 16px; border: 1px solid rgba(140,100,220,0.2);
    border-radius: 20px; background: rgba(50,35,80,0.3);
    color: rgba(180,160,220,0.7); font: 12px/1 system-ui,sans-serif;
    cursor: pointer; transition: all 0.25s; letter-spacing: 0.5px;
    display: flex; align-items: center; gap: 5px;
  }
  .preset-btn:hover {
    background: rgba(60,45,110,0.5); border-color: rgba(140,100,220,0.4);
    box-shadow: 0 0 10px rgba(140,100,220,0.15);
  }
  .preset-btn:active { transform: scale(0.95); }
  .preset-btn.active {
    background: rgba(100,70,180,0.4); border-color: rgba(160,120,240,0.5);
    color: rgba(210,190,255,0.9); box-shadow: 0 0 12px rgba(140,100,220,0.25);
  }
  .preset-btn .icon { font-size: 14px; }
  .sliders-row {
    display: flex; align-items: center; justify-content: center;
    gap: 28px; width: 100%;
  }
  .ctrl { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .ctrl label {
    font-size: 11px; color: rgba(160,140,210,0.6);
    letter-spacing: 0.5px; user-select: none; white-space: nowrap;
  }
  .ctrl input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 130px; height: 4px;
    background: rgba(80,60,140,0.3); border-radius: 2px; outline: none;
  }
  .ctrl input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px;
    border-radius: 50%; background: #9a6ef0; cursor: pointer;
    box-shadow: 0 0 8px rgba(154,110,240,0.5);
  }
  .ctrl input[type=range]::-moz-range-thumb {
    width: 14px; height: 14px; border: none;
    border-radius: 50%; background: #9a6ef0; cursor: pointer;
    box-shadow: 0 0 8px rgba(154,110,240,0.5);
  }
  .ctrl .val {
    font-size: 12px; color: rgba(180,150,255,0.8); min-width: 50px; text-align: center;
  }
  #resetBtn {
    padding: 8px 22px; border: 1px solid rgba(140,100,220,0.25);
    border-radius: 6px; background: rgba(50,35,80,0.45);
    color: rgba(190,170,235,0.8); font: 13px/1 system-ui,sans-serif;
    cursor: pointer; transition: all 0.2s; letter-spacing: 1px;
  }
  #resetBtn:hover {
    background: rgba(60,45,110,0.6); border-color: rgba(140,100,220,0.45);
    box-shadow: 0 0 14px rgba(140,100,220,0.18);
  }
  #resetBtn:active { transform: scale(0.96); }
</style>
</head>
<body>
<canvas id="sim"></canvas>
<div id="controls">
  <div class="presets-row">
    <span class="presets-label">场景</span>
    <button class="preset-btn" data-g="9.8"><span class="icon">🌍</span>地球</button>
    <button class="preset-btn" data-g="1.6"><span class="icon">🌙</span>月球</button>
    <button class="preset-btn" data-g="24.8"><span class="icon">🟠</span>木星</button>
    <button class="preset-btn" data-g="0.1"><span class="icon">🌌</span>太空</button>
  </div>
  <div class="sliders-row">
  <div class="ctrl">
    <label>摆长 L₁</label>
    <input type="range" id="sldL1" min="60" max="250" value="150" step="1">
    <span class="val" id="valL1">150 px</span>
  </div>
  <div class="ctrl">
    <label>摆长 L₂</label>
    <input type="range" id="sldL2" min="60" max="250" value="150" step="1">
    <span class="val" id="valL2">150 px</span>
  </div>
  <div class="ctrl">
    <label>质量 m₂</label>
    <input type="range" id="sldM2" min="0.5" max="5" value="1.5" step="0.1">
    <span class="val" id="valM2">1.5</span>
  </div>
  <div class="ctrl">
    <label>重力 g</label>
    <input type="range" id="sldG" min="0.1" max="25" value="9.8" step="0.1">
    <span class="val" id="valG">9.8</span>
  </div>
  <div class="ctrl">
    <label>拖尾长度</label>
    <input type="range" id="sldTrail" min="100" max="1500" value="600" step="50">
    <span class="val" id="valTrail">600</span>
  </div>
  <button id="resetBtn">重置摆动</button>
  </div>
</div>
<script>
(() => {
  'use strict';

  /* ====== Canvas 初始化 (支持高 DPI) ====== */
  const canvas = document.getElementById('sim');
  const ctx = canvas.getContext('2d');
  let W, H, dpr;
  const PANEL_H = 162;

  function resize() {
    dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight - PANEL_H;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  /* ====== 物理参数 ====== */
  let L1 = 150, L2 = 150;       // 两段摆长 (px)
  let m1 = 1.5, m2 = 1.5;       // 两个摆球质量
  let G  = 9.8;                   // 重力加速度
  let currentG = G;               // 平滑过渡用当前重力值
  let targetG = G;                // 目标重力值
  const DEFAULT_G = 9.8;          // 默认重力
  const SCALE = 40;               // 像素/米 缩放因子
  const DT = 1 / 240;            // 固定物理步长 (s) — 高频率保证稳定性
  let trailMax = 600;             // 拖尾最大点数

  /* ====== 状态变量 [θ₁, ω₁, θ₂, ω₂] ====== */
  let state = [Math.PI * 0.6, 0, Math.PI * 0.8, 0];
  let simTime = 0;
  let lastStamp = null;
  let accum = 0;

  /* ====== 拖拽交互 ====== */
  let dragging = 0;  // 0=无, 1=拖拽球1, 2=拖拽球2

  /* ====== 拖尾缓冲 ====== */
  const trail = [];  // { x, y, hue }

  /* ====== 坐标工具 ====== */
  function pivot() {
    return { x: W / 2, y: Math.min(H * 0.25, 200) };
  }

  function bob1XY() {
    const p = pivot();
    return {
      x: p.x + L1 * Math.sin(state[0]),
      y: p.y + L1 * Math.cos(state[0])
    };
  }

  function bob2XY() {
    const b1 = bob1XY();
    return {
      x: b1.x + L2 * Math.sin(state[2]),
      y: b1.y + L2 * Math.cos(state[2])
    };
  }

  /* ====== 双摆微分方程 (Lagrangian 力学) ====== */
  function derivs(s) {
    const th1 = s[0], w1 = s[1], th2 = s[2], w2 = s[3];
    const l1 = L1 / SCALE, l2 = L2 / SCALE;
    const dth = th1 - th2;
    const sinD = Math.sin(dth), cosD = Math.cos(dth);
    const M = m1 + m2;

    // 分母
    const den = 2 * m1 + m2 - m2 * Math.cos(2 * dth);

    // θ₁'' 加速度
    const a1_num = -G * (2 * m1 + m2) * Math.sin(th1)
                 - m2 * G * Math.sin(th1 - 2 * th2)
                 - 2 * sinD * m2 * (w2 * w2 * l2 + w1 * w1 * l1 * cosD);
    const a1 = a1_num / (l1 * den);

    // θ₂'' 加速度
    const a2_num = 2 * sinD * (
        w1 * w1 * l1 * M
      + G * M * Math.cos(th1)
      + w2 * w2 * l2 * m2 * cosD
    );
    const a2 = a2_num / (l2 * den);

    return [w1, a1, w2, a2];
  }

  /* ====== Runge-Kutta 4 阶积分器 ====== */
  function rk4Step(s, dt) {
    const k1 = derivs(s);
    const s2 = [
      s[0] + k1[0] * dt * 0.5,
      s[1] + k1[1] * dt * 0.5,
      s[2] + k1[2] * dt * 0.5,
      s[3] + k1[3] * dt * 0.5
    ];
    const k2 = derivs(s2);
    const s3 = [
      s[0] + k2[0] * dt * 0.5,
      s[1] + k2[1] * dt * 0.5,
      s[2] + k2[2] * dt * 0.5,
      s[3] + k2[3] * dt * 0.5
    ];
    const k3 = derivs(s3);
    const s4 = [
      s[0] + k3[0] * dt,
      s[1] + k3[1] * dt,
      s[2] + k3[2] * dt,
      s[3] + k3[3] * dt
    ];
    const k4 = derivs(s4);

    return [
      s[0] + (k1[0] + 2*k2[0] + 2*k3[0] + k4[0]) * dt / 6,
      s[1] + (k1[1] + 2*k2[1] + 2*k3[1] + k4[1]) * dt / 6,
      s[2] + (k1[2] + 2*k2[2] + 2*k3[2] + k4[2]) * dt / 6,
      s[3] + (k1[3] + 2*k2[3] + 2*k3[3] + k4[3]) * dt / 6
    ];
  }

  /* ====== 物理步进 ====== */
  function step(dt) {
    state = rk4Step(state, dt);
    // 安全钳制：防止数值爆炸
    for (let i = 1; i <= 3; i += 2) {
      if (Math.abs(state[i]) > 100) state[i] = Math.sign(state[i]) * 100;
    }
    simTime += dt;
  }

  /* ====== 绘制：背景网格 ====== */
  function drawGrid() {
    ctx.strokeStyle = 'rgba(255,255,255,0.018)';
    ctx.lineWidth = 0.5;
    const gap = 50;
    for (let x = gap; x < W; x += gap) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = gap; y < H; y += gap) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
  }

  /* ====== 绘制：彩虹渐变拖尾 ====== */
  function drawTrail() {
    const len = trail.length;
    if (len < 2) return;

    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    for (let i = 1; i < len; i++) {
      const t = i / len;  // 0→1 (旧→新)
      const p0 = trail[i - 1];
      const p1 = trail[i];

      // 色相随时间循环，透明度随年龄衰减
      const hue = (p1.hue) % 360;
      const alpha = t * t * 0.7;  // 二次衰减曲线，尾部更柔和
      const width = 1.0 + t * 3.0;

      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y);
      ctx.lineTo(p1.x, p1.y);
      ctx.strokeStyle = 'hsla(' + hue + ',85%,60%,' + alpha.toFixed(3) + ')';
      ctx.lineWidth = width;
      ctx.stroke();
    }
  }

  /* ====== 绘制：支架 ====== */
  function drawBracket() {
    const p = pivot();
    ctx.fillStyle = '#2e2e42';
    const bw = 80, bh = 8, r = 4;
    ctx.beginPath();
    ctx.moveTo(p.x - bw / 2 + r, p.y - bh / 2);
    ctx.arcTo(p.x + bw / 2, p.y - bh / 2, p.x + bw / 2, p.y + bh / 2, r);
    ctx.arcTo(p.x + bw / 2, p.y + bh / 2, p.x - bw / 2, p.y + bh / 2, r);
    ctx.arcTo(p.x - bw / 2, p.y + bh / 2, p.x - bw / 2, p.y - bh / 2, r);
    ctx.arcTo(p.x - bw / 2, p.y - bh / 2, p.x + bw / 2, p.y - bh / 2, r);
    ctx.fill();
  }

  /* ====== 绘制：摆杆 ====== */
  function drawRods() {
    const p = pivot(), b1 = bob1XY(), b2 = bob2XY();

    // 杆1
    const g1 = ctx.createLinearGradient(p.x, p.y, b1.x, b1.y);
    g1.addColorStop(0, 'rgba(160,140,200,0.6)');
    g1.addColorStop(1, 'rgba(130,110,170,0.35)');
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(b1.x, b1.y);
    ctx.strokeStyle = g1;
    ctx.lineWidth = 2.2;
    ctx.stroke();

    // 杆2
    const g2 = ctx.createLinearGradient(b1.x, b1.y, b2.x, b2.y);
    g2.addColorStop(0, 'rgba(140,120,180,0.5)');
    g2.addColorStop(1, 'rgba(120,100,160,0.3)');
    ctx.beginPath();
    ctx.moveTo(b1.x, b1.y);
    ctx.lineTo(b2.x, b2.y);
    ctx.strokeStyle = g2;
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  /* ====== 绘制：枢轴 ====== */
  function drawPivot() {
    const p = pivot();
    ctx.beginPath();
    ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
    ctx.fillStyle = '#5a5a75';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
    ctx.fillStyle = '#8a8aa5';
    ctx.fill();
  }

  /* ====== 绘制：摆球 (多层发光) ====== */
  function drawBob(x, y, radius, color, glowColor) {
    // 外层光晕
    ctx.save();
    ctx.shadowColor = glowColor;
    ctx.shadowBlur = 40;
    const g1 = ctx.createRadialGradient(x, y, 0, x, y, radius * 3);
    g1.addColorStop(0, glowColor.replace('0.5', '0.15'));
    g1.addColorStop(0.5, glowColor.replace('0.5', '0.04'));
    g1.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.beginPath();
    ctx.arc(x, y, radius * 3, 0, Math.PI * 2);
    ctx.fillStyle = g1;
    ctx.fill();
    ctx.restore();

    // 球体
    ctx.save();
    ctx.shadowColor = glowColor;
    ctx.shadowBlur = 20;
    const g2 = ctx.createRadialGradient(x - radius * 0.3, y - radius * 0.3, 1, x, y, radius);
    g2.addColorStop(0, color[0]);
    g2.addColorStop(0.4, color[1]);
    g2.addColorStop(0.8, color[2]);
    g2.addColorStop(1, color[3]);
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.fillStyle = g2;
    ctx.fill();
    ctx.restore();

    // 高光
    const g3 = ctx.createRadialGradient(
      x - radius * 0.35, y - radius * 0.35, 0,
      x - radius * 0.25, y - radius * 0.25, radius * 0.55
    );
    g3.addColorStop(0, 'rgba(255,255,255,0.5)');
    g3.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.beginPath();
    ctx.arc(x - radius * 0.3, y - radius * 0.3, radius * 0.55, 0, Math.PI * 2);
    ctx.fillStyle = g3;
    ctx.fill();
  }

  function drawBobs() {
    const b1 = bob1XY(), b2 = bob2XY();
    drawBob(b1.x, b1.y, 15,
      ['#e8d0ff', '#b080e8', '#7a50c0', '#4a2888'],
      'rgba(160,100,240,0.5)');
    drawBob(b2.x, b2.y, 13,
      ['#d0f0ff', '#60c8f0', '#3090d0', '#1860a0'],
      'rgba(60,160,240,0.5)');
  }

  /* ====== 绘制：角度参考线 ====== */
  function drawRefLine() {
    const p = pivot();
    ctx.save();
    ctx.setLineDash([4, 6]);
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x, p.y + L1 + L2);
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();
  }

  /* ====== 绘制：HUD 信息面板 ====== */
  function drawHUD() {
    const deg1 = (state[0] * 180 / Math.PI).toFixed(1);
    const deg2 = (state[2] * 180 / Math.PI).toFixed(1);
    const w1 = state[1].toFixed(2);
    const w2 = state[3].toFixed(2);
    const sec = simTime.toFixed(1);

    // 计算总能量 (用于监控守恒)
    const l1 = L1 / SCALE, l2 = L2 / SCALE;
    const th1 = state[0], w1_ = state[1], th2 = state[2], w2_ = state[3];
    const y1 = -l1 * Math.cos(th1);
    const y2 = y1 - l2 * Math.cos(th2);
    const v1x = l1 * w1_ * Math.cos(th1);
    const v1y = -l1 * w1_ * Math.sin(th1);
    const v2x = v1x + l2 * w2_ * Math.cos(th2);
    const v2y = v1y - l2 * w2_ * Math.sin(th2);
    const KE = 0.5 * m1 * (v1x*v1x + v1y*v1y) + 0.5 * m2 * (v2x*v2x + v2y*v2y);
    const PE = m1 * G * y1 + m2 * G * y2;
    const E = (KE + PE).toFixed(2);

    ctx.save();
    ctx.font = '12px "Cascadia Code","Consolas","Courier New",monospace';
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(160,140,210,0.55)';
    const x = 24, y0 = H - 102;
    ctx.fillText('\u2220 \u03B8\u2081 = ' + deg1 + '\u00B0', x, y0);
    ctx.fillText('\u2220 \u03B8\u2082 = ' + deg2 + '\u00B0', x, y0 + 20);
    ctx.fillText('\u03C9\u2081 = ' + w1 + '  \u03C9\u2082 = ' + w2, x, y0 + 40);
    ctx.fillText('E = ' + E + ' J', x, y0 + 60);
    ctx.fillText('t = ' + sec + ' s', x, y0 + 80);

    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(160,140,210,0.4)';
    const rx = W - 24;
    ctx.fillText('L\u2081 = ' + L1 + '  L\u2082 = ' + L2, rx, y0);
    ctx.fillText('m\u2081 = ' + m1.toFixed(1) + '  m\u2082 = ' + m2.toFixed(1), rx, y0 + 20);
    ctx.fillText('g = ' + currentG.toFixed(1), rx, y0 + 40);
    ctx.fillText('RK4 \u0394t = ' + (DT * 1000).toFixed(1) + ' ms', rx, y0 + 60);
    ctx.restore();
  }

  /* ====== 绘制：标题 ====== */
  function drawTitle() {
    ctx.save();
    ctx.font = '600 15px system-ui,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(180,160,220,0.45)';
    ctx.fillText('\u53CC \u6446 \u6DF7 \u6C8C \u6A21 \u62DF \u5668', W / 2, 32);
    ctx.font = '11px system-ui,sans-serif';
    ctx.fillStyle = 'rgba(160,140,200,0.25)';
    ctx.fillText('Double Pendulum Chaos \u00B7 RK4 Integration \u00B7 Week 05', W / 2, 50);
    ctx.restore();
  }

  /* ====== 绘制：操作提示（自动淡出） ====== */
  function drawHint() {
    let a = 0.4;
    if (simTime > 4) a = Math.max(0, 0.4 - (simTime - 4) * 0.08);
    if (a <= 0) return;
    ctx.save();
    ctx.font = '12px system-ui,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(180,160,220,' + a.toFixed(3) + ')';
    ctx.fillText('\u62D6\u62FD\u6446\u7403\u8BBE\u5B9A\u521D\u59CB\u89D2\u5EA6\uFF0C\u91CA\u653E\u540E\u89C2\u5BDF\u6DF7\u6C8C\u8FD0\u52A8', W / 2, H - 130);
    ctx.restore();
  }

  /* ====== 主渲染循环 ====== */
  let hueCounter = 0;

  function frame(stamp) {
    if (lastStamp === null) lastStamp = stamp;
    let dt = (stamp - lastStamp) / 1000;
    lastStamp = stamp;
    if (dt > 0.1) dt = 0.1;

    if (!dragging) {
      accum += dt;
      while (accum >= DT) {
        step(DT);
        accum -= DT;
      }
      // 记录拖尾
      const b2 = bob2XY();
      hueCounter = (hueCounter + 1.2) % 360;
      trail.push({ x: b2.x, y: b2.y, hue: hueCounter });
      while (trail.length > trailMax) trail.shift();
    }

    // 重力平滑过渡
    if (Math.abs(currentG - targetG) > 0.01) {
      currentG = lerp(currentG, targetG, 0.06);
      G = currentG;
    }

    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#0d0d18';
    ctx.fillRect(0, 0, W, H);

    drawGrid();
    drawTitle();
    drawRefLine();
    drawTrail();
    drawBracket();
    drawRods();
    drawPivot();
    drawBobs();
    drawHUD();
    drawHint();

    requestAnimationFrame(frame);
  }

  /* ====== 鼠标交互 ====== */
  function mousePos(e) {
    return { x: e.clientX, y: e.clientY };
  }

  canvas.addEventListener('mousedown', function (e) {
    const m = mousePos(e);
    const b1 = bob1XY(), b2 = bob2XY();
    // 优先拖拽更远的球2
    if (Math.hypot(m.x - b2.x, m.y - b2.y) < 35) {
      dragging = 2;
      trail.length = 0;
    } else if (Math.hypot(m.x - b1.x, m.y - b1.y) < 35) {
      dragging = 1;
      trail.length = 0;
    }
  });

  canvas.addEventListener('mousemove', function (e) {
    if (!dragging) return;
    const m = mousePos(e), p = pivot();
    if (dragging === 1) {
      state[0] = Math.atan2(m.x - p.x, m.y - p.y);
      state[1] = 0;
      state[3] = 0;
    } else if (dragging === 2) {
      const b1 = bob1XY();
      state[2] = Math.atan2(m.x - b1.x, m.y - b1.y);
      state[1] = 0;
      state[3] = 0;
    }
  });

  canvas.addEventListener('mouseup', function () {
    if (dragging) {
      dragging = 0;
      state[1] = 0;
      state[3] = 0;
      simTime = 0;
      accum = 0;
    }
  });

  canvas.addEventListener('mouseleave', function () {
    if (dragging) {
      dragging = 0;
      state[1] = 0;
      state[3] = 0;
      simTime = 0;
      accum = 0;
    }
  });

  /* ====== 触摸交互 ====== */
  canvas.addEventListener('touchstart', function (e) {
    e.preventDefault();
    const t = e.touches[0];
    const b1 = bob1XY(), b2 = bob2XY();
    if (Math.hypot(t.clientX - b2.x, t.clientY - b2.y) < 45) {
      dragging = 2;
      trail.length = 0;
    } else if (Math.hypot(t.clientX - b1.x, t.clientY - b1.y) < 45) {
      dragging = 1;
      trail.length = 0;
    }
  }, { passive: false });

  canvas.addEventListener('touchmove', function (e) {
    e.preventDefault();
    if (!dragging) return;
    const t = e.touches[0], p = pivot();
    if (dragging === 1) {
      state[0] = Math.atan2(t.clientX - p.x, t.clientY - p.y);
      state[1] = 0;
      state[3] = 0;
    } else if (dragging === 2) {
      const b1 = bob1XY();
      state[2] = Math.atan2(t.clientX - b1.x, t.clientY - b1.y);
      state[1] = 0;
      state[3] = 0;
    }
  }, { passive: false });

  canvas.addEventListener('touchend', function () {
    if (dragging) {
      dragging = 0;
      state[1] = 0;
      state[3] = 0;
      simTime = 0;
      accum = 0;
    }
  });

  /* ====== DOM 元素引用（必须在 loadParams 之前） ====== */
  const sldL1 = document.getElementById('sldL1');
  const sldL2 = document.getElementById('sldL2');
  const sldM2 = document.getElementById('sldM2');
  const sldG  = document.getElementById('sldG');
  const sldTrail = document.getElementById('sldTrail');
  const valL1 = document.getElementById('valL1');
  const valL2 = document.getElementById('valL2');
  const valM2 = document.getElementById('valM2');
  const valG  = document.getElementById('valG');
  const valTrail = document.getElementById('valTrail');

  /* ====== 天体预设 ====== */
  const PRESETS = {
    '9.8':  { name: '地球', icon: '🌍' },
    '1.6':  { name: '月球', icon: '🌙' },
    '24.8': { name: '木星', icon: '' },
    '0.1':  { name: '太空', icon: '🌌' }
  };

  function lerp(a, b, t) { return a + (b - a) * t; }

  /* ====== localStorage 持久化 ====== */
  const STORAGE_KEY = 'pendulum_params_v1';

  function saveParams() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        L1: L1, L2: L2, m2: m2, G: targetG, trailMax: trailMax
      }));
    } catch (e) { /* 静默失败 */ }
  }

  function loadParams() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return false;
      var p = JSON.parse(raw);
      if (p.L1 != null) { L1 = p.L1; sldL1.value = L1; valL1.textContent = L1 + ' px'; }
      if (p.L2 != null) { L2 = p.L2; sldL2.value = L2; valL2.textContent = L2 + ' px'; }
      if (p.m2 != null) { m2 = p.m2; sldM2.value = m2; valM2.textContent = m2.toFixed(1); }
      if (p.G  != null) {
        G = Math.max(0.1, Math.min(25, p.G));
        G = Math.round(G * 10) / 10;
        currentG = G; targetG = G;
        sldG.value = G; valG.textContent = G.toFixed(1);
      }
      if (p.trailMax != null) { trailMax = p.trailMax; sldTrail.value = trailMax; valTrail.textContent = trailMax; }
      return true;
    } catch (e) { return false; }
  }

  function setActivePreset(gVal) {
    const key = gVal.toFixed(1);
    document.querySelectorAll('.preset-btn').forEach(function (btn) {
      btn.classList.toggle('active', btn.dataset.g === key);
    });
  }

  function applyGravity(gVal) {
    targetG = gVal;
    G = gVal;
    sldG.value = gVal;
    valG.textContent = gVal.toFixed(1);
    setActivePreset(gVal);
    saveParams();
  }

  /* 启动时尝试恢复缓存 */
  var restored = loadParams();
  setActivePreset(restored ? G : DEFAULT_G);

  /* ====== 控制面板交互 ====== */
  sldL1.addEventListener('input', function () {
    L1 = +this.value; valL1.textContent = L1 + ' px'; trail.length = 0; saveParams();
  });
  sldL2.addEventListener('input', function () {
    L2 = +this.value; valL2.textContent = L2 + ' px'; trail.length = 0; saveParams();
  });
  sldM2.addEventListener('input', function () {
    m2 = +this.value; valM2.textContent = m2.toFixed(1); saveParams();
  });
  sldG.addEventListener('input', function () {
    G = +this.value; currentG = G; targetG = G; valG.textContent = G.toFixed(1);
    setActivePreset(G); saveParams();
  });
  sldTrail.addEventListener('input', function () {
    trailMax = +this.value; valTrail.textContent = trailMax; saveParams();
  });

  /* 预设按钮 */
  document.querySelectorAll('.preset-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      applyGravity(+this.dataset.g);
    });
  });

  /* ====== 重置 ====== */
  function resetAnimation() {
    state = [Math.PI * 0.6, 0, Math.PI * 0.8, 0];
    simTime = 0;
    accum = 0;
    lastStamp = null;
    trail.length = 0;
    hueCounter = 0;
    L1 = 150; L2 = 150; m1 = 1.5; m2 = 1.5;
    G = DEFAULT_G; currentG = DEFAULT_G; targetG = DEFAULT_G;
    trailMax = 600;
    sldL1.value = 150; valL1.textContent = '150 px';
    sldL2.value = 150; valL2.textContent = '150 px';
    sldM2.value = 1.5;  valM2.textContent = '1.5';
    sldG.value = DEFAULT_G;   valG.textContent = DEFAULT_G.toFixed(1);
    sldTrail.value = 600; valTrail.textContent = '600';
    setActivePreset(DEFAULT_G);
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
  }

  document.getElementById('resetBtn').addEventListener('click', resetAnimation);

  /* ====== 启动 ====== */
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
