<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>单摆模拟器 · Week 05</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a24; }
  canvas { display: block; cursor: grab; }
  canvas:active { cursor: grabbing; }
</style>
</head>
<body>
<canvas id="sim"></canvas>
<script>
(() => {
  'use strict';

  /* ====== Canvas 初始化 (支持高 DPI) ====== */
  const canvas = document.getElementById('sim');
  const ctx = canvas.getContext('2d');
  let W, H, dpr;

  function resize() {
    dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  /* ====== 物理参数 ====== */
  const L     = 200;          // 摆长 (px)
  const G     = 9.8;          // 重力加速度
  const SCALE = 50;           // 像素/米 缩放因子
  const DAMP  = 0.999;        // 微弱阻尼
  const DT    = 1 / 120;      // 固定物理步长 (s)

  /* ====== 状态变量 ====== */
  let theta     = Math.PI / 4;   // 当前摆角 (rad)，正=右偏
  let omega     = 0;             // 角速度 (rad/s)
  let simTime   = 0;
  let lastStamp = null;
  let accum     = 0;             // 时间累加器

  /* ====== 拖拽交互 ====== */
  let dragging = false;

  /* ====== 运动轨迹 ====== */
  const trail = [];
  const TRAIL_MAX = 80;

  /* ====== 坐标工具 ====== */
  function pivot() {
    return { x: W / 2, y: Math.min(H * 0.22, 180) };
  }
  function bobXY(th) {
    const p = pivot();
    return { x: p.x + L * Math.sin(th), y: p.y + L * Math.cos(th) };
  }

  /* ====== 物理步进 (Velocity-Verlet) ====== */
  function step(dt) {
    const gEff = G * SCALE / L;
    const a0 = -gEff * Math.sin(theta);
    theta += omega * dt + 0.5 * a0 * dt * dt;
    const a1 = -gEff * Math.sin(theta);
    omega = (omega + 0.5 * (a0 + a1) * dt) * DAMP;
    simTime += dt;
  }

  /* ====== 绘制：背景网格 ====== */
  function drawGrid() {
    ctx.strokeStyle = 'rgba(255,255,255,0.025)';
    ctx.lineWidth = 0.5;
    const gap = 50;
    for (let x = gap; x < W; x += gap) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = gap; y < H; y += gap) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
  }

  /* ====== 绘制：运动轨迹 ====== */
  function drawTrail() {
    if (trail.length < 2) return;
    for (let i = 1; i < trail.length; i++) {
      const t = i / trail.length;
      ctx.beginPath();
      ctx.moveTo(trail[i - 1].x, trail[i - 1].y);
      ctx.lineTo(trail[i].x, trail[i].y);
      ctx.strokeStyle = 'rgba(80,180,255,' + (t * 0.35).toFixed(3) + ')';
      ctx.lineWidth = t * 2.5;
      ctx.stroke();
    }
  }

  /* ====== 绘制：支架 ====== */
  function drawBracket() {
    const p = pivot();
    ctx.fillStyle = '#3a3a50';
    const bw = 80, bh = 8, r = 4;
    ctx.beginPath();
    ctx.moveTo(p.x - bw / 2 + r, p.y - bh / 2);
    ctx.arcTo(p.x + bw / 2, p.y - bh / 2, p.x + bw / 2, p.y + bh / 2, r);
    ctx.arcTo(p.x + bw / 2, p.y + bh / 2, p.x - bw / 2, p.y + bh / 2, r);
    ctx.arcTo(p.x - bw / 2, p.y + bh / 2, p.x - bw / 2, p.y - bh / 2, r);
    ctx.arcTo(p.x - bw / 2, p.y - bh / 2, p.x + bw / 2, p.y - bh / 2, r);
    ctx.fill();
  }

  /* ====== 绘制：摆杆 ====== */
  function drawRod() {
    const p = pivot(), b = bobXY(theta);
    const grad = ctx.createLinearGradient(p.x, p.y, b.x, b.y);
    grad.addColorStop(0, 'rgba(180,180,200,0.7)');
    grad.addColorStop(1, 'rgba(140,140,160,0.4)');
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(b.x, b.y);
    ctx.strokeStyle = grad;
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  /* ====== 绘制：枢轴 ====== */
  function drawPivot() {
    const p = pivot();
    ctx.beginPath();
    ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
    ctx.fillStyle = '#6a6a80';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
    ctx.fillStyle = '#9a9ab0';
    ctx.fill();
  }

  /* ====== 绘制：摆球（多层发光） ====== */
  function drawBob() {
    const b = bobXY(theta);
    const R = 18;

    // 外层光晕
    ctx.save();
    ctx.shadowColor = 'rgba(60,160,255,0.55)';
    ctx.shadowBlur = 45;
    const g1 = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, R * 3);
    g1.addColorStop(0, 'rgba(70,170,255,0.18)');
    g1.addColorStop(0.5, 'rgba(50,130,255,0.05)');
    g1.addColorStop(1, 'rgba(40,100,255,0)');
    ctx.beginPath();
    ctx.arc(b.x, b.y, R * 3, 0, Math.PI * 2);
    ctx.fillStyle = g1;
    ctx.fill();
    ctx.restore();

    // 球体
    ctx.save();
    ctx.shadowColor = 'rgba(80,180,255,0.85)';
    ctx.shadowBlur = 22;
    const g2 = ctx.createRadialGradient(b.x - 5, b.y - 5, 2, b.x, b.y, R);
    g2.addColorStop(0, '#dceeff');
    g2.addColorStop(0.35, '#5ca8f0');
    g2.addColorStop(0.75, '#3578c4');
    g2.addColorStop(1, '#1e4d8c');
    ctx.beginPath();
    ctx.arc(b.x, b.y, R, 0, Math.PI * 2);
    ctx.fillStyle = g2;
    ctx.fill();
    ctx.restore();

    // 高光
    const g3 = ctx.createRadialGradient(b.x - 6, b.y - 6, 0, b.x - 4, b.y - 4, 9);
    g3.addColorStop(0, 'rgba(255,255,255,0.55)');
    g3.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.beginPath();
    ctx.arc(b.x - 5, b.y - 5, 9, 0, Math.PI * 2);
    ctx.fillStyle = g3;
    ctx.fill();
  }

  /* ====== 绘制：角度参考线 ====== */
  function drawRefLine() {
    const p = pivot();
    ctx.save();
    ctx.setLineDash([4, 6]);
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x, p.y + L);
    ctx.strokeStyle = 'rgba(255,255,255,0.07)';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();
  }

  /* ====== 绘制：HUD 信息面板 ====== */
  function drawHUD() {
    const deg = (theta * 180 / Math.PI).toFixed(1);
    const vel = omega.toFixed(3);
    const sec = simTime.toFixed(1);

    ctx.save();
    ctx.font = '13px "Cascadia Code","Consolas","Courier New",monospace';
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(130,175,220,0.6)';
    const x = 24, y0 = H - 80;
    ctx.fillText('\u2220  \u03B8 = ' + deg + '\u00B0', x, y0);
    ctx.fillText('\u03C9 = ' + vel + ' rad/s', x, y0 + 22);
    ctx.fillText('t = ' + sec + ' s', x, y0 + 44);
    ctx.restore();
  }

  /* ====== 绘制：标题 ====== */
  function drawTitle() {
    ctx.save();
    ctx.font = '600 15px system-ui,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(160,185,220,0.45)';
    ctx.fillText('\u5355 \u6446 \u6A21 \u62DF \u5668', W / 2, 32);
    ctx.font = '11px system-ui,sans-serif';
    ctx.fillStyle = 'rgba(140,160,190,0.25)';
    ctx.fillText('Simple Pendulum Simulator \u00B7 Week 05', W / 2, 50);
    ctx.restore();
  }

  /* ====== 绘制：操作提示（自动淡出） ====== */
  function drawHint() {
    let a = 0.4;
    if (simTime > 3) a = Math.max(0, 0.4 - (simTime - 3) * 0.1);
    if (a <= 0) return;
    ctx.save();
    ctx.font = '12px system-ui,sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(160,180,210,' + a.toFixed(3) + ')';
    ctx.fillText('\u62D6\u62FD\u6446\u7403\u8BBE\u5B9A\u521D\u59CB\u89D2\u5EA6', W / 2, H - 24);
    ctx.restore();
  }

  /* ====== 主渲染循环 ====== */
  function frame(stamp) {
    if (lastStamp === null) lastStamp = stamp;
    let dt = (stamp - lastStamp) / 1000;
    lastStamp = stamp;
    if (dt > 0.1) dt = 0.1;

    if (!dragging) {
      accum += dt;
      while (accum >= DT) {
        step(DT);
        accum -= DT;
      }
      const b = bobXY(theta);
      trail.push({ x: b.x, y: b.y });
      if (trail.length > TRAIL_MAX) trail.shift();
    }

    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#1a1a24';
    ctx.fillRect(0, 0, W, H);

    drawGrid();
    drawTitle();
    drawRefLine();
    drawTrail();
    drawBracket();
    drawRod();
    drawPivot();
    drawBob();
    drawHUD();
    drawHint();

    requestAnimationFrame(frame);
  }

  /* ====== 鼠标交互 ====== */
  function mousePos(e) {
    return { x: e.clientX, y: e.clientY };
  }

  canvas.addEventListener('mousedown', function (e) {
    const m = mousePos(e), b = bobXY(theta);
    if (Math.hypot(m.x - b.x, m.y - b.y) < 35) {
      dragging = true;
      trail.length = 0;
    }
  });

  canvas.addEventListener('mousemove', function (e) {
    if (!dragging) return;
    const m = mousePos(e), p = pivot();
    theta = Math.atan2(m.x - p.x, m.y - p.y);
    omega = 0;
  });

  canvas.addEventListener('mouseup', function () {
    if (dragging) { dragging = false; simTime = 0; omega = 0; }
  });

  canvas.addEventListener('mouseleave', function () {
    if (dragging) { dragging = false; simTime = 0; omega = 0; }
  });

  /* ====== 触摸交互 ====== */
  canvas.addEventListener('touchstart', function (e) {
    e.preventDefault();
    const t = e.touches[0], b = bobXY(theta);
    if (Math.hypot(t.clientX - b.x, t.clientY - b.y) < 45) {
      dragging = true;
      trail.length = 0;
    }
  }, { passive: false });

  canvas.addEventListener('touchmove', function (e) {
    e.preventDefault();
    if (!dragging) return;
    const t = e.touches[0], p = pivot();
    theta = Math.atan2(t.clientX - p.x, t.clientY - p.y);
    omega = 0;
  }, { passive: false });

  canvas.addEventListener('touchend', function () {
    if (dragging) { dragging = false; simTime = 0; omega = 0; }
  });

  /* ====== 启动 ====== */
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
